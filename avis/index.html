<!--
  Page publique de recueil d'avis (lien unique envoyé par l'animatrice).
  Générée par scripts/build-review-page.sh : l'URL Supabase et la clé publique
  (anon, déjà présente dans l'APK) remplacent les marqueurs ci-dessous.
  La page n'a accès qu'aux fonctions get_review_invite et submit_review.
-->
<style>
  :root {
    --brand: #1b4332; --brand-light: #2d6a4f; --accent: #f97316; --bg: #f0fdf4;
    --surface: #ffffff; --text: #1f2937; --muted: #6b7280; --border: #d1d5db; --danger: #b91c1c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 18px/1.5 -apple-system, Roboto, "Segoe UI", Arial, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  .logo { display: block; height: 72px; width: auto; margin: 8px auto 12px; }
  h1 { color: var(--brand); text-align: center; font-size: 28px; margin: 0 0 4px; }
  p.lead { text-align: center; margin: 0 0 24px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; display: grid; gap: 16px; }
  .stars { display: flex; justify-content: center; gap: 6px; }
  .stars button { font-size: 44px; line-height: 1; background: none; border: 0; cursor: pointer; color: var(--border); padding: 4px; min-width: 52px; min-height: 52px; }
  .stars button.on { color: var(--accent); }
  .stars button:focus-visible { outline: 3px solid var(--brand-light); border-radius: 8px; }
  label { font-weight: 600; display: grid; gap: 6px; }
  input[type=text], textarea { font: inherit; padding: 12px 14px; border: 2px solid var(--border); border-radius: 12px; width: 100%; background: #fff; color: var(--text); }
  textarea { min-height: 140px; resize: vertical; }
  input:focus, textarea:focus { outline: none; border-color: var(--brand-light); }
  .consent { display: flex; gap: 12px; align-items: flex-start; font-weight: 400; }
  .consent input { width: 28px; height: 28px; margin: 2px 0 0; accent-color: var(--brand); flex: none; }
  button.send { font: inherit; font-weight: 700; color: #fff; background: var(--brand); border: 0; border-radius: 12px; padding: 16px; min-height: 56px; cursor: pointer; }
  button.send:disabled { opacity: .6; cursor: default; }
  .error { color: var(--danger); font-weight: 600; }
  .center { text-align: center; }
  .small { color: var(--muted); font-size: 14px; text-align: center; margin-top: 24px; }
  [hidden] { display: none !important; }
</style>
</head>

<script>
(function () {
  var URL_BASE = 'https://qfjtcynkikvgznasxaae.supabase.co';
  var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFmanRjeW5raWt2Z3puYXN4YWFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxNjg0ODksImV4cCI6MjA4OTc0NDQ4OX0.a4ZvMEsEsCSuISsDnEox2Oc9MbpGcB7vzL0wMM_W9IM';
  var token = new URLSearchParams(location.search).get('t') || '';
  var rating = 5;
  var $ = function (id) { return document.getElementById(id); };

  function rpc(name, body) {
    return fetch(URL_BASE + '/rest/v1/rpc/' + name, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: KEY, Authorization: 'Bearer ' + KEY },
      body: JSON.stringify(body)
    }).then(function (r) {
      return r.json().then(function (data) { if (!r.ok) throw new Error(data && data.message || 'Erreur'); return data; });
    });
  }

  function show(id) {
    ['loading', 'invalid', 'form-section', 'thanks'].forEach(function (s) { $(s).hidden = s !== id; });
  }

  function renderStars() {
    var box = $('stars');
    box.innerHTML = '';
    for (var i = 1; i <= 5; i++) {
      (function (n) {
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = '★';
        b.className = n <= rating ? 'on' : '';
        b.setAttribute('role', 'radio');
        b.setAttribute('aria-checked', String(n === rating));
        b.setAttribute('aria-label', n + ' étoile' + (n > 1 ? 's' : ''));
        b.onclick = function () { rating = n; renderStars(); };
        box.appendChild(b);
      })(i);
    }
  }

  if (token.length < 32) { show('invalid'); return; }

  rpc('get_review_invite', { p_token: token }).then(function (rows) {
    var inv = rows && rows[0];
    if (!inv) { show('invalid'); return; }
    if (inv.already_used) { $('invalid-msg').textContent = 'Vous avez déjà donné votre avis avec ce lien. Merci !'; show('invalid'); return; }
    if (inv.expired) { $('invalid-msg').textContent = 'Ce lien a expiré. Demandez-en un nouveau à votre animatrice.'; show('invalid'); return; }
    // textContent : aucun risque d'injection HTML avec le prénom.
    $('hello').textContent = 'Bonjour ' + inv.name + ', comment trouvez-vous les séances ?';
    $('name').value = inv.name;
    renderStars();
    show('form-section');
  }).catch(function () {
    $('invalid-msg').textContent = 'Connexion impossible. Vérifiez votre accès à Internet puis rechargez la page.';
    show('invalid');
  });

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var content = $('content').value.trim();
    var err = $('error');
    if (content.length < 3) { err.textContent = 'Écrivez quelques mots.'; err.hidden = false; return; }
    err.hidden = true;
    $('send').disabled = true;
    rpc('submit_review', {
      p_token: token, p_rating: rating, p_content: content,
      p_display_name: $('name').value.trim(), p_consent: $('consent').checked
    }).then(function (ok) {
      if (ok) show('thanks');
      else { $('invalid-msg').textContent = 'Ce lien a déjà été utilisé ou a expiré.'; show('invalid'); }
    }).catch(function () {
      err.textContent = 'L’envoi n’a pas fonctionné. Réessayez dans un instant.';
      err.hidden = false;
      $('send').disabled = false;
    });
  });
})();
</script>
</body>
</html>
